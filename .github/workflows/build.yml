name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run isolated self-test
        shell: pwsh
        run: ./scripts/build-native.ps1 -SkipInstaller
